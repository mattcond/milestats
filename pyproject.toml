[project]
name = "milestats"
version = "0.1.0"
description = "Lettura file .fit e calcolo velocità/passo tramite formula haversine"
requires-python = ">=3.10"
dependencies = [
    "fitparse>=1.2.0",
    "openpyxl>=3.1",
]

[project.scripts]
milestats = "milestats.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milestats"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
